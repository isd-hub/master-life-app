<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Life App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="eyebrow">Master Life App</div>
  <h1>Home</h1>
</header>

<main>
  <h2 class="section-title">Reminders</h2>
  <div class="card" id="remindersCard">
    <div class="empty-state">Laden…</div>
  </div>

  <h2 class="section-title">Agenda</h2>
  <div class="card" id="calendarCard">
    <div class="empty-state">Laden…</div>
  </div>

  <h2 class="section-title">Secties</h2>
  <div class="tile-grid">
    <a class="tile" style="--tile-accent:var(--self-care)" href="self-care-dashboard.html">
      <span class="tile-label">Self Care</span>
      <span class="tile-sub">Habits, when-did-I-last, period tracker</span>
    </a>
    <a class="tile soon" style="--tile-accent:var(--home)" href="home.html">
      <span class="tile-label">Home</span>
      <span class="tile-sub">Boodschappen, cleaning, finances, auto</span>
    </a>
    <a class="tile soon" style="--tile-accent:var(--home-improvement)" href="home-improvement.html">
      <span class="tile-label">Home Improvement</span>
      <span class="tile-sub">Verbouw- en klusprojecten</span>
    </a>
    <a class="tile soon" style="--tile-accent:var(--collections)" href="collections.html">
      <span class="tile-label">Collections</span>
      <span class="tile-sub">Movies, brain dump, to look up, to buy</span>
    </a>
  </div>
</main>

<script type="module">
  function showFatalError(where, err){
    const msg = `<div class="empty-state" style="color:#B5502E;"><b>Fout in ${where}:</b><br>${(err && err.message) ? err.message : String(err)}</div>`;
    const r = document.getElementById('remindersCard');
    const c = document.getElementById('calendarCard');
    if(r) r.innerHTML = msg;
    if(c) c.innerHTML = msg;
  }

  window.addEventListener('error', (e) => showFatalError('script', e.error || e.message));

  (async () => {
    let db, doc, getDoc;
    try{
      const cfg = await import('./assets/firebase-config.js');
      db = cfg.db;
      const fs = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js");
      doc = fs.doc; getDoc = fs.getDoc;
    }catch(e){
      showFatalError('het laden van Firebase', e);
      return;
    }

        async function loadFeed(docId, card, renderItem, emptyLabel, howToLabel, sortFn){
      try{
        const snap = await getDoc(doc(db, 'feeds', docId));
        if(!snap.exists() || !(snap.data().items||[]).length){
          card.innerHTML = `<div class="empty-state"><b>${emptyLabel}</b><br>${howToLabel}</div>`;
          return;
        }
        let items = snap.data().items;
        if(typeof sortFn === 'function'){
          items = items.slice().sort(sortFn);
        }
        card.innerHTML = items.slice(0,5).map(renderItem).join('');
      }catch(e){
        card.innerHTML = `<div class="empty-state" style="color:#B5502E;"><b>Fout bij ophalen:</b><br>${e.message}</div>`;
      }
    }


   function getTodayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getLocalReminderState(){
  const raw = localStorage.getItem('remindersLocalState');
  if(!raw) return {};
  try{
    const parsed = JSON.parse(raw);
    if(parsed.day !== getTodayKey()){
      return {};
    }
    return parsed.items || {};
  }catch(e){
    return {};
  }
}

function setLocalReminderState(key, isCompleted){
  const items = getLocalReminderState();
  items[key] = isCompleted;
  localStorage.setItem('remindersLocalState', JSON.stringify({
    day: getTodayKey(),
    items
  }));
}

function isReminderDone(i){
  if(typeof i === 'string') return false;
  const key = reminderKey(i.title, i.listName, i.dueDate);
  const localState = getLocalReminderState();
  return key in localState ? localState[key] : !!i.isCompleted;
}

function reminderSort(a, b){
  return (isReminderDone(a) ? 1 : 0) - (isReminderDone(b) ? 1 : 0);
}

function reminderKey(title, listName, dueDate){
  return `${title}|||${listName}|||${dueDate}`;
}

window.toggleReminder = async function(title, listName, dueDate, checkboxEl){
  const key = reminderKey(title, listName, dueDate);
  const goingToComplete = checkboxEl.checked;
  const actionType = goingToComplete ? 'complete' : 'reopen';

  checkboxEl.disabled = true;
  try{
        await fetch('https://addaction-mvo6meffaq-uc.a.run.app', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ collection: 'reminderActions', key, type: actionType, title, listName, dueDate })
    });
    setLocalReminderState(key, goingToComplete);
    checkboxEl.parentElement.style.opacity = goingToComplete ? '0.4' : '1';
  }catch(e){
    checkboxEl.checked = !goingToComplete;
    alert('Kon actie niet versturen: ' + e.message);
  }finally{
    checkboxEl.disabled = false;
  }
};

loadFeed(
  'reminders',
  document.getElementById('remindersCard'),
  (i) => {
    if(typeof i === 'string'){
      return `<div style="padding:6px 0; font-size:14px;">${i}</div>`;
    }
    const t = (i.title||'').replace(/"/g,'&quot;');
    const l = (i.listName||'').replace(/"/g,'&quot;');
    const d = (i.dueDate||'').replace(/"/g,'&quot;');

    const key = reminderKey(i.title, i.listName, i.dueDate);
    const localState = getLocalReminderState();
    const isDone = key in localState ? localState[key] : !!i.isCompleted;

    return `<div style="padding:6px 0; font-size:14px; display:flex; align-items:center; gap:8px; opacity:${isDone ? '0.4' : '1'};">
      <input type="checkbox" style="accent-color: #6b5b95;" ${isDone ? 'checked' : ''} onclick="toggleReminder('${t}','${l}','${d}', this)">
      <span>${i.title}</span>
    </div>`;
  },
    'Nog geen reminders binnengekomen.',
  'Deze widget vult zich zodra de Shortcuts-koppeling met Apple Reminders actief is.',
  reminderSort
);



    const calendarColorMap = { 'Privé': '#C77B93', 'Pat & Ira': '#4C7A5D' };
    const fallbackColor = '#9B8FC9';
    function colorForCalendar(name){
      return calendarColorMap[name] || fallbackColor;
    }

    loadFeed(
      'calendar',
      document.getElementById('calendarCard'),
      (i) => {
        if(typeof i !== 'string') return `<div style="padding:6px 0; font-size:14px;">${i.title||i}</div>`;
        const lastDot = i.lastIndexOf('.');
        let titleAndDate = i, cal;
        if(lastDot !== -1){
          titleAndDate = i.slice(0, lastDot).trim();
          cal = i.slice(lastDot + 1).trim();
        }
        const dot = cal ? ` <span style="color:${colorForCalendar(cal)};font-size:22px;">•</span>` : '';
        return `<div style="padding:6px 0; font-size:14px;">${titleAndDate}${dot}</div>`;
      },
      'Nog geen agenda-items binnengekomen.',
      'Deze widget vult zich zodra de Shortcuts-koppeling met Apple Agenda actief is.'
    );
  })();
</script>

</body>
</html>
